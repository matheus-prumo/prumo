<style>

/* =================== v4.0: interface nova =================== */
:root {

/* ---------- v4.1: tema delicado do consultório ---------- */
body.tema-cons { --accent: #7a68a6; --accent-fg: #ffffff; --accent-soft: #efeaf7; --bg: #f8f5f7; --panel: #fffdfe; --panel-2: #f4eff5; --line: #ebe3ec; --muted: #77707f;
  --c1: #7a68a6; --c2: #d49a8f; --c3: #7fa596; --c4: #b58bb3; --c5: #c7a76a; --ok: #4f8f72; --grid: #f0eaf1; --card-sh: 0 1px 2px rgba(90, 70, 110, .05), 0 8px 24px rgba(90, 70, 110, .06); }
@media (prefers-color-scheme: dark) { body.tema-cons { --accent: #b3a3db; --accent-fg: #1d1826; --accent-soft: #2c2638; --bg: #16141a; --panel: #1f1c24; --panel-2: #29252f; --line: #36303d; --muted: #a59eae; --c1: #b3a3db; --c2: #e0ada3; --c3: #9cc4b4; --ok: #86c4a6; --grid: #2b2731; } }
body.tema-cons main { background: radial-gradient(1100px 420px at 85% -120px, color-mix(in srgb, var(--c4) 16%, transparent), transparent 70%), radial-gradient(800px 380px at 0% 0%, color-mix(in srgb, var(--c3) 12%, transparent), transparent 70%); }
body.tema-cons .top { background: color-mix(in srgb, var(--bg) 80%, transparent); }
body.tema-cons .card, body.tema-cons .kpi { border-radius: 18px; }
body.tema-cons .subnav { background: var(--accent-soft); }
body.tema-cons .subnav button.on { color: var(--accent); }
body.tema-cons .btn.primary { box-shadow: 0 3px 12px color-mix(in srgb, var(--accent) 30%, transparent); }
body.tema-cons .nav button.tab-btn[data-tab=cons].active { background: var(--accent-soft); color: var(--accent); }
.cons-ola { display: flex; align-items: center; gap: 14px; margin: 0 0 14px; padding: 16px 20px; border-radius: 18px; background: linear-gradient(120deg, color-mix(in srgb, var(--c4) 16%, var(--panel)), color-mix(in srgb, var(--c3) 14%, var(--panel))); border: 1px solid var(--line); }
.cons-ola .flor { width: 44px; height: 44px; flex: none; color: var(--accent); }
.cons-ola b { font-size: 17px; font-weight: 650; letter-spacing: -.01em; display: block; } .cons-ola span { color: var(--muted); font-size: 13px; }
.cons-ola .nums { margin-left: auto; display: flex; gap: 18px; text-align: right; } .cons-ola .nums div b { font-size: 22px; color: var(--accent); }
@media (max-width: 860px) { .cons-ola .nums { display: none; } }
/* ---------- v4.1: Consultório (Hoje, agenda, escalas, cartas, lousa) ---------- */
body.tema-cons .priv-btn { display: none; }
.cons-ola .priv { align-self: center; }
.hoje { clear: both; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 14px; align-items: start; }
.hoje-pac { padding: 12px; position: sticky; top: 84px; display: grid; gap: 8px; }
.hoje-busca input { width: 100%; }
.hoje-filtros { display: flex; flex-wrap: wrap; gap: 4px; } .hoje-filtros button { border: 0; background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; } .hoje-filtros button.on { background: var(--accent); color: var(--accent-fg); }
.hoje-lista { display: grid; gap: 6px; max-height: calc(100vh - 300px); overflow: auto; padding-right: 2px; }
.pac-i { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--pc); border-radius: 12px; padding: 8px 10px; cursor: pointer; color: var(--fg); }
.pac-i:hover { background: var(--panel-2); }
.pac-av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--pc); }
.pac-i b { font-size: 13px; font-weight: 600; display: block; } .pac-i small { color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 5px; }
.pac-i .pt { width: 7px; height: 7px; border-radius: 50%; background: var(--c3); display: inline-block; } .pac-i .pt.hj { background: var(--c2); }
.hoje-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; } .hoje-acoes .grow { flex: 1; }
.linha-dia { display: grid; gap: 6px; }
.ld { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 12px; background: var(--panel-2); border-left: 4px solid var(--pc, var(--line)); }
.ld b { font-variant-numeric: tabular-nums; } .ld span small { display: block; color: var(--muted); font-size: 12px; } .ld.feito { opacity: .6; } .ld.agora { box-shadow: inset 0 0 0 2px var(--accent); } .ld.x { color: var(--muted); background: repeating-linear-gradient(45deg, var(--panel-2), var(--panel-2) 6px, transparent 6px, transparent 12px); }
.notas-l { display: grid; gap: 6px; } .notas-l button { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 8px 10px; cursor: pointer; color: var(--fg); } .notas-l b { display: block; font-size: 13px; } .notas-l small { color: var(--muted); font-size: 12px; }
.nota-txt { background: var(--panel-2); border-radius: 10px; padding: 12px 14px; max-height: 52vh; overflow: auto; line-height: 1.6; }
.ev[style*="--pc"] { box-shadow: inset 3px 0 0 var(--pc); }
.seg-v { display: inline-flex; background: var(--panel-2); border-radius: 9px; padding: 2px; } .seg-v button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 13px; } .seg-v button.on { background: var(--panel); color: var(--accent); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.ag-mes { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
.ag-mes .cab { padding: 8px; text-align: center; font-weight: 600; font-size: 12px; color: var(--muted); background: var(--panel-2); }
.ag-mes .dia { min-height: 96px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: 4px 5px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
.ag-mes .dia:nth-child(7n + 1) { border-left: 0; } .ag-mes .dia:hover { background: var(--panel-2); } .ag-mes .dia.fora { opacity: .45; } .ag-mes .dia .n { font-size: 12px; font-weight: 600; color: var(--muted); } .ag-mes .dia.hoje .n { color: var(--accent-fg); background: var(--accent); border-radius: 999px; padding: 0 7px; align-self: flex-start; }
.ag-mes .chip { color: var(--fg); font-size: 11px; border-radius: 6px; padding: 1px 5px; background: color-mix(in srgb, var(--pc, var(--muted)) 20%, var(--panel)); border-left: 3px solid var(--pc, var(--muted)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .ag-mes .chip.feito { opacity: .55; } .ag-mes .chip.x { --pc: var(--muted); } .ag-mes .mais { font-size: 11px; color: var(--muted); }
.esc-l { display: grid; gap: 10px; max-height: 54vh; overflow: auto; padding-right: 4px; }
.esc-i { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; } .esc-i .q { font-size: 13.5px; color: var(--fg); } .esc-i.sens { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.esc-o { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .esc-o button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: 6px; cursor: pointer; font-size: 12px; color: var(--fg); display: grid; } .esc-o button small { color: var(--muted); } .esc-o button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); } .esc-o button.on small { color: inherit; }
.esc-tot { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.evo.rasc { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 5%, var(--panel)); }
.acomp-h { font-size: 13px; margin: 6px 0 8px; color: var(--muted); font-weight: 600; }
.freq { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; align-items: end; } .freq > div { display: grid; gap: 3px; justify-items: center; } .freq .b { height: 90px; width: 100%; max-width: 26px; display: flex; flex-direction: column-reverse; background: var(--grid); border-radius: 6px; overflow: hidden; } .freq .r { background: var(--c1); display: block; } .freq .f { background: var(--c2); display: block; } .freq small { font-size: 10.5px; color: var(--muted); }
.lousas { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; } .lousas button { border: 1px solid var(--line); border-radius: 10px; padding: 4px; background: var(--panel); cursor: pointer; display: grid; gap: 3px; } .lousas img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 7px; } .lousas small { color: var(--muted); }
.sit-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--grid); margin: 4px 0 12px; } .sit-bar i { display: block; height: 100%; }
.sit-l { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; } .sit-l > div { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; color: var(--muted); } .sit-l b { display: block; color: var(--fg); font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; } .sit-l small { font-size: 11px; }
/* sobreposições (cartas e lousa) */
.ov-cons { position: fixed; inset: 0; z-index: 80; background: #f7f3f8; color: #2f2a3a; display: flex; flex-direction: column; font-family: var(--sans); }
.ov-barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 18px; background: #fff; border-bottom: 1px solid #e8e0ea; }
.ov-barra b { margin-right: 8px; font-size: 15px; } .ov-barra .grow { flex: 1; }
.ov-barra button, .ov-barra select { border: 1px solid #e3d9e6; background: #faf7fb; color: #2f2a3a; border-radius: 9px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
.ov-barra button.on { background: #7a68a6; color: #fff; border-color: #7a68a6; } .ov-barra button.prim { background: #7a68a6; color: #fff; border-color: #7a68a6; } .ov-barra button.fim { background: #c96f63; color: #fff; border-color: #c96f63; }
.ov-barra button.cor { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #d8cfdc; } .ov-barra button.cor.on { box-shadow: 0 0 0 2px #7a68a6; }
.ov-dica { margin: 8px 18px 0; color: #77707f; font-size: 12.5px; }
.cartas-g { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 18px; align-content: start; }
.carta { aspect-ratio: 3/4; border-radius: 18px; border: 0; cursor: pointer; background: linear-gradient(150deg, #8e7cc3, #6fa894); color: #fff; display: grid; place-items: center; align-content: center; gap: 10px; padding: 14px; text-align: center; box-shadow: 0 6px 18px rgba(90, 70, 110, .18); transition: transform .15s; font: inherit; }
.carta:hover { transform: translateY(-3px); } .carta i { font-style: normal; font-size: 34px; opacity: .85; }
.carta.aberta { background: var(--cc); color: #2f2a3a; } .carta b { font-size: 20px; font-weight: 650; } .carta span { font-size: 13px; line-height: 1.35; color: #5b5464; }
.carta-foco { position: absolute; inset: 0; top: 0; z-index: 2; background: rgba(247, 243, 248, .94); display: grid; place-items: center; align-content: center; gap: 10px; cursor: pointer; color: #77707f; }
.carta.grande { width: min(360px, 70vw); cursor: pointer; } .carta.grande b { font-size: 34px; } .carta.grande span { font-size: 18px; }
#lousa canvas { flex: 1; margin: 12px 18px 18px; border-radius: 16px; background: #fffdf9; box-shadow: 0 4px 18px rgba(90, 70, 110, .12); touch-action: none; cursor: crosshair; min-height: 0; }
@media (max-width: 1100px) { .hoje { grid-template-columns: 1fr; } .hoje-pac { position: static; } .hoje-lista { max-height: 260px; } .sit-l { grid-template-columns: 1fr 1fr; } }
@media print { .ov-cons { display: none !important; } }
/* ---------- v4.2: Planejar e Investimentos ---------- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-content: start; }
.cal .cab { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.cal .dia { min-height: 86px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 6px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; cursor: pointer; font: inherit; color: var(--fg); text-align: left; }
.cal .dia:hover { border-color: var(--axis); } .cal .dia.passado { background: var(--panel-2); } .cal .dia.sel { box-shadow: inset 0 0 0 2px var(--accent); } .cal .dia.hoje .n { background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 0 7px; }
.cal .dia.neg { background: color-mix(in srgb, var(--bad) 9%, var(--panel)); border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.cal .n { font-size: 12px; font-weight: 650; } .cal .e { font-size: 11px; color: var(--ok); } .cal .s { font-size: 11px; color: var(--bad); } .cal .sd { margin-top: auto; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; } .cal .dia.neg .sd { color: var(--bad); }
.env-t td { vertical-align: middle; } .env-in { width: 110px; text-align: right; }
.desafios { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.desafio { display: grid; grid-template-columns: 70px 1fr; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--panel-2); }
.desafio b { display: block; } .desafio small { display: block; margin-top: 2px; } .desafio small { color: var(--muted); font-size: 12px; } .desafio.ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); } .desafio.quebrado { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.anel { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--grid) 0); position: relative; }
.anel::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--panel-2); } .anel span { position: relative; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.desafio.quebrado .anel { background: conic-gradient(var(--warn) calc(var(--p) * 1%), var(--grid) 0); } .desafio.ok .anel { background: conic-gradient(var(--ok) 100%, var(--grid) 0); }
.se-l { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0; font-size: 13.5px; } .se-l input { width: 140px; text-align: right; }
.se-res { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; } .se-res > div { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; } .se-res small { color: var(--muted); font-size: 11.5px; display: block; } .se-res b { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
.escada .passos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.passo { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid transparent; }
.passo .c { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid var(--line); color: var(--muted); }
.passo b { display: block; font-size: 13.5px; } .passo small { color: var(--muted); font-size: 12px; line-height: 1.4; display: block; margin-top: 2px; }
.passo.ok .c { background: var(--ok); border-color: var(--ok); color: var(--bg); } .passo.ok b { color: var(--muted); } .passo.agora { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); } .passo.agora .c { border-color: var(--accent); color: var(--accent); }
.aloc { margin: 8px 0; } .track.dupla { position: relative; overflow: visible; } .track.dupla i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); border-radius: 1px; }
.aporte-sim { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 13px; } .aporte-sim input { width: 110px; text-align: right; margin-left: 6px; }
.sim-g { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 10px; margin-bottom: 6px; } .sim-g label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); } .sim-g input { width: 100%; text-align: right; }
.barras-ano { display: flex; gap: 4px; align-items: flex-end; height: 120px; margin-top: 12px; } .barras-ano > div { flex: 1; display: flex; flex-direction: column-reverse; height: 100%; position: relative; } .barras-ano i { display: block; width: 100%; } .barras-ano .ap { background: var(--c2); border-radius: 0 0 3px 3px; } .barras-ano .ju { background: var(--c1); border-radius: 3px 3px 0 0; } .barras-ano small { position: absolute; bottom: -16px; width: 100%; text-align: center; font-size: 10px; color: var(--muted); }
.aprender { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
td .icon-btn small { font-size: 10px; vertical-align: super; }
@media (max-width: 860px) { .cal .dia { min-height: 64px; } .cal .e, .cal .s { display: none; } }
/* ---------- v4.3: investimentos ---------- */
.cmp { display: grid; gap: 8px; } .cmp > div { display: grid; grid-template-columns: 110px 1fr 100px; gap: 10px; align-items: center; font-size: 13px; } .cmp b { text-align: right; font-variant-numeric: tabular-nums; }
.rp { display: flex; flex-wrap: wrap; gap: 6px; } .rp span { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; background: var(--panel-2); } .rp span small { color: var(--muted); } .rp .ok { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); color: var(--ok); } .rp .prox { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.meta-inv { display: grid; gap: 4px; margin: 10px 0; } .meta-inv small { font-size: 12px; }
.guia-d { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: var(--panel-2); } .guia-d summary { cursor: pointer; } .guia-d[open] { background: var(--panel); }
.estudos li { margin-bottom: 4px; }
/* ===== v4.4 consultório interativo ===== */
#tour{position:fixed;inset:0;z-index:95;pointer-events:none}
#tour .tour-luz{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(30,24,40,.55);border:2px solid #fff;transition:all .25s ease;pointer-events:none}
#tour .tour-bal{position:fixed;pointer-events:auto;background:var(--panel,#fff);color:var(--ink);border-radius:16px;padding:16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.28);display:grid;gap:6px;transition:top .25s,left .25s}
#tour .tour-bal small{color:var(--muted);font-size:12px}#tour .tour-bal b{font-size:16px}#tour .tour-bal p{margin:0 0 6px;line-height:1.45;font-size:14px}
.rotina{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:6px;grid-column:1/-1}
.rotina .rt{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--muted);cursor:pointer;font-family:inherit}
.rotina .rt:hover{border-color:var(--accent);color:var(--ink)}
.rotina .rt.ok{border-style:solid;border-color:transparent;background:color-mix(in srgb,var(--good,#3a8f6b) 14%,transparent);color:var(--good,#3a8f6b)}
.rotina .sep{width:10px;height:1px;background:var(--line)}.rotina .rt-n{margin-left:auto;font-size:11px;color:var(--muted)}
.linha-dia .ld{flex-wrap:wrap}
.wiz{display:flex;gap:6px;margin:2px 0 4px}.wiz span{flex:1;text-align:center;padding:7px 4px;border-radius:10px;background:var(--soft,#f2eff7);font-size:12.5px;color:var(--muted)}
.wiz span.on{background:var(--accent);color:#fff;font-weight:600}.wiz span.ok{color:var(--good,#3a8f6b)}
.big-opts{display:flex;gap:10px}.big-opts button{flex:1;border:1.5px solid var(--line);background:var(--panel,#fff);border-radius:14px;padding:14px 8px;display:grid;gap:4px;justify-items:center;font:inherit;color:var(--ink);cursor:pointer}
.big-opts button span{font-size:24px}.big-opts button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.prox-ses{padding:10px 12px;border-radius:12px;background:var(--soft,#f2eff7);font-size:14px}
.ov-cons.calmo{background:linear-gradient(160deg,#f4f0fa,#eaf4f1)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .ov-cons.calmo{background:linear-gradient(160deg,#211d2b,#18262a)}}

<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const BRL0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const fmt = (v) => BRL.format(v || 0);
const fmt0 = (v) => BRL0.format(v || 0);
const pct = (v) => (isFinite(v) ? (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%' : '—');
const pad = (n) => String(n).padStart(2, '0');
const r2 = (v) => Math.round(v * 100) / 100;
const hoje = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MC = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const ymOf = (s) => String(s).slice(0, 7);
const addM = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const addMDate = (ymd, n) => { const [y, m, d] = ymd.split('-').map(Number); const last = new Date(y, m + n, 0).getDate(); const dt = new Date(y, m - 1 + n, Math.min(d, last)); return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`; };
const diffM = (a, b) => { const [ya, ma] = a.split('-').map(Number); const [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); };
const nomeMes = (ym) => `${MESES[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const curto = (ym) => `${MC[+ym.slice(5, 7) - 1]}/${ym.slice(2, 4)}`;
const dmy = (s) => String(s).slice(0, 10).split('-').reverse().join('/');
const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
function parseValor(v) {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').replace(/[R$\s]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
const valorTxt = (v) => (isFinite(v) && v !== '' && v != null ? Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '');
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), 3200);
}
function baixar(nome, conteudo, tipo) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo })); a.download = nome;
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- dados ---------- */
const DEFAULT_CATS = [
  ['Salário', 'Receita'], ['Renda extra', 'Receita'],
  ['Moradia', 'Despesa'], ['Contas da casa', 'Despesa'], ['Mercado', 'Despesa'], ['Transporte', 'Despesa'], ['Saúde', 'Despesa'], ['Educação', 'Despesa'],
  ['Comer fora e delivery', 'Despesa'], ['Lazer', 'Despesa'], ['Cuidados pessoais', 'Despesa'], ['Assinaturas', 'Despesa'], ['Compras', 'Despesa'], ['Pets', 'Despesa'], ['Presentes e doações', 'Despesa'], ['Outros', 'Despesa'],
].map(([nome, tipo]) => ({ nome, tipo, meta: 0 }));

function emptyDB() {
  return ensureModules({
    app: 'financas-familia', versao: 1, criado: new Date().toISOString(), atualizado: '',
    membros: ['Eu', 'Cônjuge', 'Filhos', 'Casa'],
    contas: [
      { id: uid(), nome: 'Conta corrente', tipo: 'banco' },
      { id: uid(), nome: 'Cartão de crédito', tipo: 'cartao', fechamento: 25, vencimento: 5 },
      { id: uid(), nome: 'Dinheiro / Pix', tipo: 'banco' },
    ],
    categorias: DEFAULT_CATS.map((c) => ({ ...c })),
    lancamentos: [], contasPagar: [],
    metas: [{ id: uid(), nome: 'Reserva de emergência', alvo: 30000, acumulado: 0, prazo: addM(ymOf(hoje()), 12) }],
  });
}
function normalize(d) {
  const base = emptyDB();
  for (const k of ['membros', 'contas', 'categorias', 'lancamentos', 'contasPagar', 'metas']) if (!Array.isArray(d[k])) d[k] = base[k];
  d.lancamentos.forEach((l) => { l.valor = Number(l.valor) || 0; });
  return ensureModules(d);
}

function sampleDB() {
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const between = (a, b) => a + rnd() * (b - a);
  const d = emptyDB();
  const itau = { id: uid(), nome: 'Itaú', tipo: 'banco' };
  const nu = { id: uid(), nome: 'Nubank', tipo: 'cartao', fechamento: 3, vencimento: 10 };
  const ci = { id: uid(), nome: 'Cartão Itaú', tipo: 'cartao', fechamento: 25, vencimento: 5 };
  d.membros = ['Carlos', 'Juliana', 'Filhos', 'Casa'];
  d.contas = [itau, nu, ci];
  const metas = { Moradia: 3900, Mercado: 2200, Educação: 2200, Transporte: 1100, Saúde: 950, 'Comer fora e delivery': 600, Lazer: 500, Assinaturas: 180, Compras: 800, Outros: 300 };
  d.categorias.forEach((c) => { c.meta = metas[c.nome] || 0; });
  const L = [];
  const add = (data, descricao, categoria, tipo, membro, conta, valor) => L.push({ id: uid(), data, descricao, categoria, tipo, membro, conta: conta.id, valor: r2(valor) });
  const parcelado = (data, descricao, categoria, membro, conta, total, n) => {
    const g = uid(); const p = r2(total / n);
    for (let i = 0; i < n; i++) L.push({ id: uid(), data: addMDate(data, i), descricao, categoria, tipo: 'Despesa', membro, conta: conta.id, valor: i === n - 1 ? r2(total - p * (n - 1)) : p, grupo: g, parcela: i + 1, parcelas: n });
  };
  const today = hoje(); const cur = ymOf(today);
  for (let i = 11; i >= 0; i--) {
    const ym = addM(cur, -i); const D = (day) => `${ym}-${pad(Math.min(day, 28))}`; const last = i === 0;
    add(D(5), 'Salário', 'Salário', 'Receita', 'Carlos', itau, 8500 + (i < 6 ? 300 : 0));
    add(D(5), 'Salário', 'Salário', 'Receita', 'Juliana', itau, 6200);
    if (ym.endsWith('-12')) { add(D(20), '13º salário', 'Salário', 'Receita', 'Carlos', itau, 8500); add(D(20), '13º salário', 'Salário', 'Receita', 'Juliana', itau, 6200); }
    if (rnd() < 0.5) add(D(18), 'Projeto freelance', 'Renda extra', 'Receita', 'Juliana', itau, [900, 1200, 1500, 2100][Math.floor(rnd() * 4)]);
    add(D(5), 'Aluguel', 'Moradia', 'Despesa', 'Casa', itau, 2800);
    add(D(10), 'Condomínio', 'Moradia', 'Despesa', 'Casa', itau, 620);
    add(D(12), 'Conta de luz', 'Moradia', 'Despesa', 'Casa', itau, between(190, 290));
    add(D(15), 'Internet e celular', 'Moradia', 'Despesa', 'Casa', nu, 189.9);
    add(D(10), 'Mensalidade escolar', 'Educação', 'Despesa', 'Filhos', itau, 1450);
    if (rnd() < 0.6) add(D(22), 'Material e livros', 'Educação', 'Despesa', 'Filhos', nu, between(60, 180));
    add(D(20), 'Plano de saúde', 'Saúde', 'Despesa', 'Casa', itau, 780);
    if (rnd() < 0.5) add(D(14), 'Farmácia', 'Saúde', 'Despesa', 'Juliana', nu, between(40, 160));
    const merc = last ? 2350 : between(1850, 2150);
    [0.32, 0.18, 0.27, 0.23].forEach((p, k) => add(D(3 + k * 7), 'Supermercado', 'Mercado', 'Despesa', 'Casa', nu, merc * p));
    add(D(8), 'Combustível', 'Transporte', 'Despesa', 'Carlos', ci, between(380, 470));
    add(D(23), 'Combustível', 'Transporte', 'Despesa', 'Juliana', nu, between(250, 330));
    if (rnd() < 0.4) add(D(17), 'Manutenção do carro', 'Transporte', 'Despesa', 'Carlos', ci, between(150, 420));
    const rest = last ? 680 : between(380, 560);
    add(D(9), 'Restaurante', 'Comer fora e delivery', 'Despesa', 'Casa', ci, rest * 0.55);

  else if (cur.r > 0) insight = `Em ${nomeMes(ui.mes)}${ui.membro ? ` (${esc(ui.membro)})` : ''}, ${cur.s >= 0 ? 'sobraram' : 'faltaram'} <b class="${cur.s >= 0 ? 'good' : 'bad'}">${fmt(Math.abs(cur.s))}</b>${cur.s >= 0 ? `, ou <b>${pct(cur.t)}</b> da renda` : ''}. ${acima.length ? `<b class="bad">${acima.length} ${acima.length > 1 ? 'categorias passaram' : 'categoria passou'} do orçamento</b>: ${acima.map((a) => esc(a.nome)).join(', ')}.` : 'Todas as categorias estão dentro do orçamento.'}`;
  else insight = `Em ${nomeMes(ui.mes)}, as despesas ${filtroTxt} somam <b>${fmt(cur.d)}</b>.`;

  // pessoas
  const pessoas = new Map();

  const pList = [...pessoas].sort((a, b) => b[1] - a[1]); const pMax = Math.max(1, ...pList.map((p) => p[1]));

  // vencimentos
  const pend = db.contasPagar.filter((c) => c.status !== 'Pago').sort((a, b) => (a.vencimento < b.vencimento ? -1 : 1));
  const hojeYm = ymOf(hoje()); const diaHoje = +hoje().slice(8, 10);
  const cartoesV = db.contas.filter((c) => c.tipo === 'cartao').map((c) => c.vencimento || 1);
  const inicioFat = cartoesV.length && diaHoje > Math.max(...cartoesV) ? addM(hojeYm, 1) : hojeYm;
  const mesesFat = [0, 1, 2, 3, 4, 5].map((i) => addM(inicioFat, i));
  const fats = faturas(mesesFat);
  const proxFat = fats.map((f) => {
    const j = mesesFat.findIndex((m) => `${m}-${pad(Math.min(28, f.conta.vencimento || 1))}` >= hoje());
    return j < 0 ? null : { nome: 'Fatura ' + f.conta.nome, v: f.valores[j], venc: `${mesesFat[j]}-${pad(Math.min(28, f.conta.vencimento || 1))}` };
  }).filter((f) => f && f.v > 0);
  const venc = [...pend.map((c) => ({ nome: c.descricao, v: c.valor, venc: c.vencimento, st: statusConta(c) })), ...proxFat.map((f) => ({ ...f, st: 'Fatura' }))]
    .sort((a, b) => (a.venc < b.venc ? -1 : 1)).slice(0, 7);

  // metas
  const metasHtml = db.metas.length ? db.metas.map((m) => barRow({ nome: m.nome, valor: `${fmt0(m.acumulado)} de ${fmt0(m.alvo)}`, frac: m.acumulado / m.alvo, cls: 'c3', sub: `${pct(m.acumulado / m.alvo)} · prazo ${curto(m.prazo)}`, attrs: 'data-go="metas"' })).join('') : '<div class="empty">Nenhuma meta cadastrada.</div>';

  el.innerHTML = `${lembreteDia('familia', 'Família')}${lembreteResumo()}
  <div class="painel-acoes"><button class="btn sm" data-posso title="Ver o efeito de uma compra nos próximos meses">🤔 Posso comprar?</button><button class="btn sm" data-resumo-sem>🗓 Resumo da semana</button><button class="btn sm" data-personalizar title="Escolher o que aparece no painel">⚙ Personalizar</button><button class="btn sm" data-anual title="Resumo do ano inteiro em PDF">📅 Retrospecto do ano</button><button class="btn sm" data-relatorio title="Imprimir ou salvar em PDF">📄 Relatório do mês</button></div>
  <div class="grid painel-g"><div class="wide" data-wid="passos">${cardPrimeirosPassos()}</div><div class="wide" data-wid="avisos">${blocoAvisosPainel()}</div>${widgetRapido()}
  <div class="wide" data-wid="resumo"><p class="insight">${insight}</p>
  <div class="kpis">
    ${kpi('Receitas do mês', cur.r, prev.r, true)}
    ${kpi('Despesas do mês', cur.d, prev.d, false)}
    ${kpi('Saldo do mês', cur.s, prev.s, true)}
    ${kpi('Taxa de poupança', cur.t, prev.t, true, pct, true)}
  </div></div>${widgetPrevisao()}${widgetGrupos()}${widgetCredito()}${widgetFuturo()}${widgetPatrimonio()}${widgetDesafios()}${widgetHojeCons()}${widgetRecomeco()}
    <div class="card wide" data-wid="grafico">
      <div class="card-h"><h2>Receitas × despesas</h2><span class="sub">12 meses até ${curto(ui.mes)} · clique num mês para abri-lo</span></div>
      <div class="legend"><span><i style="background:var(--c1)"></i>Receitas</span><span><i style="background:var(--c2)"></i>Despesas</span></div>
      <div class="chart" id="chMensal"></div>
    </div>
    <div class="card" data-wid="orcamento">
      <div class="card-h"><h2>Orçamento por categoria</h2><button class="btn sm" data-limites title="O app sugere limites pelos últimos 3 meses">💡 Sugerir limites</button></div>
      <p class="sub">${curto(ui.mes)} · gasto contra a meta. Clique para filtrar tudo por categoria</p>
      ${(() => { const r = orc.filter((o) => o.meta > 0 && o.uso >= 0.8).sort((a, b) => b.uso - a.uso)[0]; return r ? `<div class="orc-alerta ${r.uso > 1 ? 'bad' : ''}">${textoAlerta(r, ui.mes)}</div>` : ''; })()}
      <div class="bars ${ui.categoria ? 'has-active' : ''}">${orc.length ? orc.sort((a, b) => (isFinite(b.uso) ? b.uso : -1) - (isFinite(a.uso) ? a.uso : -1) || b.gasto - a.gasto).map((o) => barRow({
        nome: o.nome, active: ui.categoria === o.nome, attrs: `data-cat="${esc(o.nome)}"`,
        valor: o.meta > 0 ? `${fmt0(o.gasto)} de ${fmt0(o.meta)} · ${pct(o.uso)}` : `${fmt0(o.gasto)} · sem meta`,
        frac: o.meta > 0 ? o.uso : 0.0001, cls: o.uso > 1 ? 'over' : o.uso > 0.85 ? 'near' : '',
      })).join('') : '<div class="empty">Sem despesas neste mês. Defina metas em Configurações.</div>'}</div>
    </div>
    <div class="card" data-wid="pessoas">
      <h2>Gastos por pessoa</h2>
      <p class="sub">${curto(ui.mes)} · “Casa” são as despesas comuns. Clique para filtrar</p>
      <div class="bars ${ui.membro ? 'has-active' : ''}">${pList.length ? pList.map(([m, v]) => barRow({ nome: m, valor: fmt(v), frac: v / pMax, cls: 'c2', active: ui.membro === m, attrs: `data-membro="${esc(m)}"` })).join('') : '<div class="empty">Sem despesas neste mês.</div>'}</div>
    </div>
    <div class="card" data-wid="faturas">
      <h2>Faturas dos cartões</h2>
      <p class="sub">Próximos 6 meses pelo vencimento · já inclui as parcelas futuras</p>
      ${fats.length ? `<div class="legend">${fats.map((f, i) => `<span><i style="background:${COLORS[(i + 2) % 5]}"></i>${esc(f.conta.nome)}</span>`).join('')}</div><div class="chart" id="chFaturas"></div>` : '<div class="empty">Cadastre um cartão em Configurações para ver as faturas.</div>'}
    </div>
    <div class="card" data-wid="vencimentos">
      <h2>Próximos vencimentos</h2>
      <p class="sub">Contas pendentes e fatura do mês</p>
      ${venc.length ? `<table class="compact"><tbody>${venc.map((v) => `<tr><td style="white-space:nowrap">${dmy(v.venc).slice(0, 5)}</td><td>${esc(v.nome)}</td><td class="num">${fmt(v.v)}</td><td class="num">${v.st === 'Fatura' ? '<span class="badge">fatura</span>' : `<span class="badge ${v.st === 'Atrasada' ? 'atr' : 'pend'}">${v.st}</span>`}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nada pendente. 🎉</div>'}
      <div style="margin-top:10px"><button class="btn sm" data-go="contas">Ver contas a pagar</button></div>
    </div>
    <div class="card span2" data-wid="metas">
      <div class="card-h"><h2>Metas da família</h2><button class="btn sm" data-go="metas">Gerenciar metas</button></div>
      <div class="metas-grid" style="margin-top:10px">${metasHtml}</div>
    </div>
  </div>`;

  aplicarLayoutPainel(el);
  const meses = Array.from({ length: 12 }, (_, i) => addM(ui.mes, i - 11));
  const tm = meses.map((m) => totais(lancs({ mes: m })));
  if ($('#chMensal')) barChart($('#chMensal'), {
    labels: meses.map(curto), tipLabels: meses.map(nomeMes), highlight: 11,
    series: [{ name: 'Receitas', color: 'var(--c1)', values: tm.map((t) => t.r) }, { name: 'Despesas', color: 'var(--c2)', values: tm.map((t) => t.d) }],
    extra: (i) => `<div style="margin-top:3px;border-top:1px solid var(--line);padding-top:3px">Saldo: <b class="${tm[i].s >= 0 ? 'good' : 'bad'}">${fmt(tm[i].s)}</b></div>`,
    onClick: (i) => { ui.mes = meses[i]; renderAll(); },
  });
  if (fats.length && $('#chFaturas')) barChart($('#chFaturas'), {
    labels: mesesFat.map(curto), tipLabels: mesesFat.map(nomeMes), stacked: true,
    series: fats.map((f, i) => ({ name: f.conta.nome, color: COLORS[(i + 2) % 5], values: f.valores })),
    extra: (i) => `<div style="margin-top:3px;border-top:1px solid var(--line);padding-top:3px">Total: <b>${fmt(fats.reduce((s, f) => s + f.valores[i], 0))}</b></div>`,
  });
}

    .sort((a, b) => (a.data === b.data ? 0 : a.data < b.data ? 1 : -1));
  const t = totais(list);
  el.innerHTML = `${reorganizarPendente() ? '<div class="lembrete info" style="margin-bottom:14px"><span>🗂 <b>Categorias novas</b> (Contas da casa, Comer fora e delivery, Cuidados pessoais, Pets, Presentes e doações): alguns lançamentos antigos combinam melhor com elas.</span><button class="btn sm primary" data-reorg>Revisar agora</button></div>' : ''}

      <label class="small muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="lTodos" ${ui.todos ? 'checked' : ''}> Todos os meses</label>
      <button class="btn" data-colar-aviso>📋 Colar aviso do banco</button><button class="btn primary" data-importar>⬆ Importar extrato</button>
      <button class="btn" id="lCsv">Exportar CSV</button>
    </div>
    ${list.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="hide-sm">Quem</th><th class="hide-sm">Pago com</th><th class="num">Valor</th><th></th></tr></thead>
      <tbody>${list.map((l) => `<tr>

        <td>${esc(l.descricao)}${l.parcelas > 1 ? `<span class="tag">${l.parcela}/${l.parcelas}</span>` : ''}</td>
        <td>${esc(l.categoria)}</td><td class="hide-sm">${esc(l.membro)}</td><td class="hide-sm">${l.tipo === 'Despesa' && formaDe(l) ? `<span class="tag-forma ${formaDe(l) === 'Crédito' ? 'cred' : ''}">${ICON_FORMA[formaDe(l)] || ''} ${esc(pagoLabel(l))}</span>` : esc(contaNome(l.conta))}</td>
        <td class="num ${l.tipo === 'Receita' ? 'good' : ''}">${l.tipo === 'Receita' ? '+' : '−'} ${fmt(l.valor)}</td>
        <td class="num"><button class="icon-btn" data-comp="${l.id}" title="Comprovantes">📎${l.comprovantes?.length ? `<small>${l.comprovantes.length}</small>` : ''}</button><button class="icon-btn" data-edit="${l.id}" title="Editar">✎</button><button class="icon-btn" data-del="${l.id}" title="Excluir">🗑</button></td>
      </tr>`).join('')}</tbody></table></div>
      <div class="totals"><span>${list.length} lançamentos</span><span>Receitas <b class="good">${fmt(t.r)}</b></span><span>Despesas <b>${fmt(t.d)}</b></span><span>Saldo <b class="${t.s >= 0 ? 'good' : 'bad'}">${fmt(t.s)}</b></span></div>`
    : `<div class="empty">Nenhum lançamento encontrado. <button class="btn sm primary" data-novo>+ Lançamento</button></div>`}
  </div>`;
  const busca = $('#lBusca');
  busca.addEventListener('input', () => { ui.busca = busca.value; const pos = busca.selectionStart; renderLancamentos(); const b = $('#lBusca'); b.focus(); b.setSelectionRange(pos, pos); });
  $('#lTipo').addEventListener('change', (e) => { ui.tipo = e.target.value; renderLancamentos(); });
  $('#lTodos').addEventListener('change', (e) => { ui.todos = e.target.checked; renderLancamentos(); });
  $('#lCsv').addEventListener('click', () => exportCsv(list));
}
$('#tab-lancamentos').addEventListener('click', (e) => {
  const ed = e.target.closest('[data-edit]'); if (ed) return formLancamento(db.lancamentos.find((l) => l.id === ed.dataset.edit));
  const del = e.target.closest('[data-del]'); if (del) return excluirLancamento(del.dataset.del);
  if (e.target.closest('[data-novo]')) formLancamento();
});
function excluirLancamento(id) {
  const l = db.lancamentos.find((x) => x.id === id); if (!l) return;
  if (l.grupo && l.parcelas > 1) {
    const todas = confirm(`"${l.descricao}" é uma compra parcelada em ${l.parcelas}x.\n\nOK = excluir TODAS as parcelas\nCancelar = escolher outra opção`);
    if (todas) db.lancamentos = db.lancamentos.filter((x) => x.grupo !== l.grupo);
    else if (confirm('Excluir só esta parcela?')) db.lancamentos = db.lancamentos.filter((x) => x.id !== id);
    else return;
  } else {
    if (!confirm(`Excluir "${l.descricao}" de ${fmt(l.valor)}?`)) return;
    db.lancamentos = db.lancamentos.filter((x) => x.id !== id);
  }
  changed();
}
function exportCsv(list) {
  const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const rows = [['Data', 'Descrição', 'Tipo', 'Categoria', 'Quem', 'Conta', 'Parcela', 'Valor'].join(';')];
  list.forEach((l) => rows.push([dmy(l.data), q(l.descricao), l.tipo, q(l.categoria), q(l.membro), q(l.tipo === 'Despesa' ? pagoLabel(l) : contaNome(l.conta)), l.parcelas > 1 ? `${l.parcela}/${l.parcelas}` : '', valorTxt(l.valor)].join(';')));
  baixar(`lancamentos-${ui.todos ? 'todos' : ui.mes}.csv`, '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8');
}

/* ---------- formulário genérico ---------- */
function openForm({ title, fields, values = {}, submit = 'Salvar', note = '', onSave, prep, wide = false, onInput }) {
  const dlg = $('#dlg'); dlg.classList.toggle('wide', !!wide); dlg.onclick = null; const v = { ...values };
  const opts = (f) => (typeof f.options === 'function' ? f.options(v) : f.options).map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const fieldHtml = (f) => {
    const val = v[f.k] ?? '';
    if (f.type === 'seg') return `<div><div class="seg">${opts(f).map((o) => `<label><input type="radio" name="${f.k}" value="${esc(o.value)}" ${String(val) === String(o.value) ? 'checked' : ''}><span>${esc(o.label)}</span></label>`).join('')}</div></div>`;
    if (f.type === 'chips') { const arr = Array.isArray(val) ? val : String(val || '').split('|').filter(Boolean); return `<div><span class="small muted">${esc(f.label)}</span><div class="chips" data-chips="${f.k}">${opts(f).map((o) => `<button type="button" class="${arr.includes(o.value) ? 'on' : ''}" data-chip="${esc(o.value)}">${esc(o.label)}</button>`).join('')}</div><input type="hidden" name="${f.k}" value="${esc(arr.join('|'))}"></div>`; }
    if (f.type === 'checkbox') return `<label class="check"><input type="checkbox" name="${f.k}" ${val ? 'checked' : ''}> ${esc(f.label)}</label>`;
    let input;
    if (f.type === 'select') { const os = opts(f); if (!os.some((o) => String(o.value) === String(val)) && os[0]) v[f.k] = os[0].value; input = `<select name="${f.k}">${os.map((o) => `<option value="${esc(o.value)}" ${String(v[f.k]) === String(o.value) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`; }
    else if (f.type === 'textarea') input = `<textarea name="${f.k}" rows="${f.rows || 5}" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}>${esc(val)}</textarea>`;
    else if (f.type === 'money') input = `<input type="text" inputmode="decimal" name="${f.k}" value="${esc(typeof val === 'number' ? valorTxt(val) : val)}" placeholder="0,00">`;
    else input = `<input type="${f.type || 'text'}" name="${f.k}" value="${esc(val)}" ${f.list ? `list="dlf-${f.k}" autocomplete="off"` : ''} ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}>`;
    return `<label>${esc(f.label)}${input}</label>${f.list ? datalistDesc('dlf-' + f.k, f.list(v)) : ''}${f.hint ? `<p class="hint" data-hint="${f.k}">${typeof f.hint === 'function' ? f.hint(v) : f.hint}</p>` : ''}`;
  };
  const collect = () => {
    $$('[name]', dlg).forEach((i) => {
      if (i.type === 'radio') { if (i.checked) v[i.name] = i.value; }
      else if (i.type === 'checkbox') v[i.name] = i.checked;
      else v[i.name] = i.value;
    });
  };
  const render = () => {
    if (prep) prep(v);
    const visible = fields.filter((f) => !f.show || f.show(v));
    let body = ''; for (let i = 0; i < visible.length; i++) {
      const f = visible[i];
      if (f.half && visible[i + 1]?.half) { body += `<div class="pair"><div>${fieldHtml(f)}</div><div>${fieldHtml(visible[i + 1])}</div></div>`; i++; } else body += fieldHtml(f);
    }
    dlg.innerHTML = `<form class="form" novalidate><h2>${esc(title)}</h2>${note ? `<p class="muted" style="margin:0">${note}</p>` : ''}${body}<p class="err" hidden></p><div class="actions"><button type="button" class="btn" data-cancel>Cancelar</button><button class="btn primary" type="submit">${esc(submit)}</button></div></form>`;
    $$('[name]', dlg).forEach((i) => {
      i.addEventListener('change', () => { const f = fields.find((x) => x.k === i.name); if (f?.rerender) { collect(); render(); } });
      i.addEventListener('input', () => { collect(); if (onInput) onInput(i.name, v, dlg); $$('[data-hint]', dlg).forEach((h) => { const f = fields.find((x) => x.k === h.dataset.hint); if (typeof f?.hint === 'function') h.textContent = f.hint(v); }); });
    });
    $$('[data-chips]', dlg).forEach((g) => g.addEventListener('click', (e) => { const b = e.target.closest('[data-chip]'); if (!b) return; b.classList.toggle('on'); $(`[name="${g.dataset.chips}"]`, dlg).value = $$('[data-chip].on', g).map((x) => x.dataset.chip).join('|'); }));
    $('[data-cancel]', dlg).addEventListener('click', () => dlg.close());
    $('form', dlg).addEventListener('submit', (e) => {
      e.preventDefault(); collect();
      for (const f of fields.filter((x) => !x.show || x.show(v))) {
        if (f.type === 'money') { v[f.k] = parseValor(v[f.k]); if (f.required && !(v[f.k] > 0)) return showErr(`Informe um valor válido em “${f.label}”.`); }
        else if (f.type === 'number') { v[f.k] = v[f.k] === '' ? '' : Number(v[f.k]); }
        else if (f.required && !String(v[f.k] ?? '').trim()) return showErr(`Preencha “${f.label}”.`);
      }
      const err = onSave(v); if (err) return showErr(err);
      dlg.close(); changed();
    });
  };
  const showErr = (m) => { const p = $('.err', dlg); p.textContent = m; p.hidden = false; };
  render(); dlg.showModal();
  const first = $('input:not([type=radio]):not([type=checkbox]), select', dlg); if (first && !values.id) setTimeout(() => $('[name=descricao]', dlg)?.focus() || first.focus(), 30);
}

function formLancamento(l) {
  const novo = !l;
  const contaDefault = db.contas[0]?.id;
  openForm({
    title: novo ? 'Novo lançamento' : 'Editar lançamento',
    values: novo ? { tipo: 'Despesa', data: hoje(), parcelas: 1, membro: ui.membro || db.membros[db.membros.length - 1], pago: pagoPadrao('Despesa'), categoria: ui.categoria } : { ...l, pago: pagoSel(l) },

        hint: (v) => { const n = Number(v.parcelas) || 1; const val = parseValor(v.valor); return n > 1 && val > 0 ? `Valor total da compra. Serão criadas ${n} parcelas de ${fmt(val / n)}, uma por mês.` : 'Use mais de 1 para compras parceladas; informe o valor total.'; } },
    ],
    onSave: (v) => {
      if (!v.categoria) return 'Escolha uma categoria (cadastre em Configurações).';
      const pg = lerPago(v.pago); if (!pg.conta) return 'Escolha como foi pago.';
      const base = { data: v.data, descricao: v.descricao.trim(), tipo: v.tipo, categoria: v.categoria, membro: v.membro, conta: pg.conta, forma: v.tipo === 'Despesa' ? pg.forma : undefined, valor: r2(v.valor) }; if (!base.forma) delete base.forma;

    },
  });
}

const AT_ST = { pago: ['Realizada · paga', 'pago'], pendente: ['Realizada · a receber', 'pend'], falta: ['Faltou', 'atr'], desmarcou: ['Desmarcou', ''] };

const COBRANCAS = ['Por sessão', 'Pacote mensal', 'Pacote quinzenal', 'Fecha no fim do mês'];

const ehSuperv = (p) => !!p && p.tipo === 'Supervisionando';

const ehPacote = (a) => a.tipo === 'Pacote de sessões';
const ehDoPacote = (a) => a.tipo === 'Sessão do pacote';

/* quanto este registro cobra, quanto já foi pago e quanto falta */
const devido = (a) => (ehDoPacote(a) ? 0 : a.status === 'pago' || a.status === 'pendente' || (a.status === 'falta' && a.cobrada) ? Number(a.valor) || 0 : 0);
const pagoDe = (a) => r2(soma(a.pagamentos || [], 'valor'));

/* pacotes */
const controlado = (pk) => pk.controle === true;

const usadas = (pk) => (Number(pk.usadasAntes) || 0) + sessoesDoPacote(pk).length;
const pacotesDe = (pid) => db.cons.atendimentos.filter((a) => ehPacote(a) && a.pacienteId === pid && controlado(a)).sort((a, b) => (a.data < b.data ? -1 : 1));

}

/* ---------- ficha financeira do paciente ---------- */
function extratoPaciente(pid) {

    const dv = devido(a); if (dv) ev.push({ data: a.data, ordem: 0, desc: `${descTipo(a)}${a.status === 'falta' ? ' (falta cobrada)' : ''}`, deb: dv, a });

    (a.pagamentos || []).forEach((p) => ev.push({ data: p.data, ordem: 1, desc: `Pagamento · ${p.forma || ''}`, cred: p.valor, a }));
  });

  let saldo = 0; ev.forEach((e) => { saldo = r2(saldo + (e.deb || 0) - (e.cred || 0)); e.saldo = saldo; });
  return ev;

// Cada registro clínico (ficha, evolução, encontro de supervisão, link de sessão, configurações) é cifrado
// separadamente (AES-GCM 256) com a chave do cofre. A chave fica guardada protegida pela senha clínica e pelo
// código de recuperação (PBKDF2). Assim a sincronização junta registro a registro sem precisar abrir nada.
let COFRE = null; // { deks: Map(kid -> CryptoKey), principal, fechados }
const CLIN = new Map(); // id -> { iv, tipo, o }
const cofreExiste = () => Object.keys(db.cons.cofreChaves || {}).length > 0;
async function cifrarClin(obj) {
  const iv = rnd(12); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, COFRE.deks.get(COFRE.principal), new TextEncoder().encode(JSON.stringify(obj)));
  return { kid: COFRE.principal, iv: b64.de(iv), ct: b64.de(ct) };
}
async function decifrarClin(r) { const k = COFRE.deks.get(r.kid); if (!k) return null; const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.para(r.iv) }, k, b64.para(r.ct)); return JSON.parse(new TextDecoder().decode(pt)); }

  for (const r of db.cons.clin) { ids.add(r.id); const c = CLIN.get(r.id); if (c && c.iv === r.iv) continue; try { const o = await decifrarClin(r); if (o) { CLIN.set(r.id, { iv: r.iv, tipo: r.tipo, o }); n++; } } catch (e) { /* registro de outra chave */ } }
  for (const id of [...CLIN.keys()]) if (!ids.has(id)) { CLIN.delete(id); n++; }

}

}

function indicadores(meses = 6) {

  const rec = soma(pags, (x) => x.p.valor); const recSup = soma(pags.filter((x) => ehSupervAt(x.a)), (x) => x.p.valor);

// Os dados são cifrados com uma chave aleatória (AES-GCM 256). Essa chave fica guardada no arquivo

let dirH = null, dirOk = false, ultimaCopiaPasta = '';

async function sincronizar(usarSalvo) {
  if (!FS) return toast('Para sincronizar, use o Microsoft Edge ou o Google Chrome.');

    let h = usarSalvo ? (syncH || (await idb.get('syncHandle').catch(() => null))) : null;
    if (!h) { toast('Escolha o financas-familia.json da pasta FinancasDaFamilia/dados do pendrive ou do HD.'); [h] = await window.showOpenFilePicker({ id: 'sync', types: FILE_TYPES }); }
    if (fh && h.isSameEntry && (await h.isSameEntry(fh))) return toast('Esse é o arquivo que já está aberto. Escolha o financas-familia.json da pasta "dados" do outro dispositivo.');
    if ((await h.requestPermission({ mode: 'readwrite' })) !== 'granted') return;
    let arq; try { arq = await h.getFile(); } catch (e) { return toast('Não encontrei o arquivo. O pendrive/HD está conectado? Use "Escolher outro arquivo…".'); }
    const txt = await arq.text();
    const outro = txt.trim() ? normalize(await desserializar(txt, { adotar: !CRIPTO, nome: h.name })) : null;
    syncH = h; await idb.set('syncHandle', h).catch(() => {}); lsSet('ff-sync-usado', '1');
    rastrear();
    let msg;
    if (!outro) msg = `A versão deste computador foi levada para o ${h.name} ✔`;
    else if ((db.atualizado || '') === (outro.atualizado || '')) msg = 'As duas versões já estavam iguais ✔';
    else {
      await guardarSnapshot('antes-sync');
      const { d, st } = mesclar(db, outro); db = d;

      msg = `Sincronizado ✔ ${p.join(', ') || 'tudo em dia'}.`;
    }
    const now = new Date().toISOString(); db.ultimaSync = now; db.atualizado = now; db.ultimaSyncCom = h.name;
    snap = fotografar(db); snapDb = db;
    const w = await h.createWritable(); await w.write(await serializar(db)); await w.close();
    backupLocal(); renderAll(); await writeFile();
    toast(msg);

}

/* =================== SINCRONIZAÇÃO AUTOMÁTICA PELO ONEDRIVE =================== */
// Cada computador tem o seu arquivo de dados (funciona sem internet). Um segundo arquivo, dentro da
// pasta do OneDrive, é o "ponto de encontro": o app junta os dois sozinho, registro a registro,
// ao abrir, a cada minuto (se algo mudou) e logo depois de cada lançamento.
// Windows: o próprio OneDrive mantém a pasta sincronizada. Linux: o backup.sh (rclone) traz e leva.
const NUVEM_PASTA = new URLSearchParams(location.search).get('nuvem') || '';
let nuvemH = null, nuvemOk = false, nuvemEm = null, nuvemErro = '', nuvemRodando = false, nuvemVisto = 0, nuvemPend = false, nuvemEscrevendo = false, nuvemTimer = null;
const sigDados = (d) => JSON.stringify(d, (k, v) => (['atualizado', 'ultimaSync', 'ultimaSyncCom'].includes(k) ? undefined : v));

async function iniciarNuvem() {
  if (CELULAR) return iniciarCelular();
  if (!FS || PORTATIL) return;
  try { nuvemH = (await idb.get('nuvemHandle')) || null; } catch (e) { nuvemH = null; }
  if (!nuvemH) { renderSave(); return; }
  try { nuvemOk = (await nuvemH.queryPermission({ mode: 'readwrite' })) === 'granted'; } catch (e) { nuvemOk = false; }
  if (db) renderAll(); else renderSave(); // atualiza Painel, avisos e primeiros passos
  if (nuvemOk) syncNuvem();
}
function nuvemAgendar(ms = 4000) { if (!nuvemH || nuvemEscrevendo) return; nuvemPend = true; clearTimeout(nuvemTimer); nuvemTimer = setTimeout(() => syncNuvem(), ms); }

/* junta este computador com o arquivo do OneDrive. manual = clique do usuário (pode pedir permissão e senha) */
async function syncNuvem({ manual = false } = {}) {
  if (!nuvemH || !db || nuvemRodando || bloqueado) return;
  if (!manual && ($('#dlg').open || saving || pending)) { clearTimeout(nuvemTimer); nuvemTimer = setTimeout(() => syncNuvem(), 5000); return; }
  nuvemRodando = true;
  try {
    let perm = await nuvemH.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted' && manual) perm = await nuvemH.requestPermission({ mode: 'readwrite' });
    nuvemOk = perm === 'granted';
    if (!nuvemOk) return;
    let f; try { f = await nuvemH.getFile(); } catch (e) { nuvemErro = e.precisaLogin ? 'login' : e.celMsg || 'Não encontrei o arquivo na pasta do OneDrive.'; return; }
    if (!manual && !nuvemPend && f.lastModified === nuvemVisto) { nuvemEm = new Date(); nuvemErro = ''; return; } // nada mudou dos dois lados
    const txt = await f.text();
    let outro = null, fmtLa = 'vazio'; const senhaAntes = CRIPTO && CRIPTO.senhaEm;
    if (txt.trim()) {
      let o; try { o = JSON.parse(txt); } catch (e) { nuvemErro = 'O arquivo do OneDrive está sendo baixado ou está danificado. Tento de novo em instantes.'; return; }
      if (ehEnvelope(o) && (!CRIPTO || CRIPTO.kid !== o.kid) && !manual) { nuvemErro = 'senha'; return; }
      fmtLa = ehEnvelope(o) ? o.kid + '|' + (o.senhaEm || '') : 'aberto';
      outro = normalize(await desserializar(txt, { adotar: !CRIPTO, nome: 'OneDrive' }));
    }
    rastrear();
    const antesAqui = sigDados(db);
    let d = db, st = null;
    if (outro) {
      ({ d, st } = mesclar(db, outro));
      if ((st.deLa || st.removidos || st.atualizados) && Date.now() - (+lsGet('ff-nuvem-snap') || 0) > 6 * 3600000) { await guardarSnapshot('antes-onedrive'); lsSet('ff-nuvem-snap', String(Date.now())); }
    }
    const novoSig = sigDados(d);
    const fmtAqui = CRIPTO ? CRIPTO.kid + '|' + (CRIPTO.senhaEm || '') : 'aberto';
    const mudaLa = !outro || novoSig !== sigDados(outro) || fmtLa !== fmtAqui; // dados diferentes ou senha trocada
    const mudaAqui = novoSig !== antesAqui;
    const senhaMudou = !!CRIPTO && CRIPTO.senhaEm !== senhaAntes; // a senha foi trocada no outro computador
    if (mudaLa || mudaAqui) d.atualizado = new Date().toISOString();
    nuvemEscrevendo = true;
    let escrito = '';
    if (mudaLa) { escrito = await serializar(d); const w = await nuvemH.createWritable(); await w.write(escrito); await w.close(); }
    if (mudaAqui || mudaLa || senhaMudou) {
      db = d; snap = fotografar(db); snapDb = db;
      backupLocal();
      if (mudaAqui) { renderAll(); if (st && st.deLa + st.atualizados + st.removidos > 0 && !manual) toast('☁ Chegaram lançamentos do outro computador.'); }
      await writeFile();
    }
    nuvemEscrevendo = false;
    if (escrito) {
      // confere se o arquivo ficou com o que gravamos (o outro computador pode ter gravado no mesmo instante)
      const f2 = await nuvemH.getFile(); const igual = (await f2.text()) === escrito;
      nuvemVisto = igual ? f2.lastModified : 0;
      if (!igual) { clearTimeout(nuvemTimer); nuvemTimer = setTimeout(() => syncNuvem(), 3000); }
    } else nuvemVisto = f.lastModified;
    nuvemEm = new Date(); nuvemErro = ''; nuvemPend = false;
    if (manual) toast(mudaAqui && st ? `☁ Sincronizado ✔ ${st.deLa ? `${st.deLa} ${st.deLa === 1 ? 'item veio' : 'itens vieram'} do outro computador` : 'tudo em dia'}.` : '☁ Sincronizado com o OneDrive ✔');
  } catch (e) {
    nuvemEscrevendo = false;
    if (e.cancelado) nuvemErro = 'senha';
    else if (e.precisaLogin) nuvemErro = 'login';
    else if (e.celMsg) nuvemErro = e.celMsg;
    else if (e.name === 'NotAllowedError') nuvemOk = false;
    else if (e.name !== 'AbortError') nuvemErro = 'Não consegui sincronizar agora (' + (e.message || e.name) + '). Tento de novo sozinho.';
  } finally { nuvemRodando = false; renderSave(); const c = $('#cardNuvem'); if (c) c.outerHTML = cardNuvem(); atualizarSino(); }
}

/* conectar: escolhe o financas-familia.json da pasta do OneDrive */
async function conectarNuvem({ inicial = false } = {}) {
  if (!FS) return toast('Use o Microsoft Edge ou o Google Chrome.');
  if (NUVEM_PASTA) { try { await navigator.clipboard.writeText(NUVEM_PASTA); toast('Caminho copiado: na janela que abrir, tecle Ctrl+L, Ctrl+V e Enter.'); } catch (e) { /* ignora */ } }
  let h;
  try { [h] = await window.showOpenFilePicker({ id: 'nuvem', types: FILE_TYPES }); } catch (e) { if (e.name !== 'AbortError') toast(e.message); return false; }
  if (fh && h.isSameEntry && (await h.isSameEntry(fh))) { toast('Esse é o arquivo deste computador. Escolha o financas-familia.json que está na pasta do OneDrive.'); return false; }
  if ((await h.requestPermission({ mode: 'readwrite' })) !== 'granted') return false;
  nuvemH = h; nuvemOk = true; nuvemVisto = 0; await idb.set('nuvemHandle', h).catch(() => {}); lsSet('ff-nuvem-usado', '1');
  if (inicial) {
    // computador novo: os dados vêm do OneDrive
    try {
      const txt = await (await h.getFile()).text();
      if (txt.trim()) { db = normalize(await desserializar(txt, { nome: 'OneDrive' })); snap = fotografar(db); snapDb = db; backupLocal(); renderAll(); }
    } catch (e) { if (e.danificado) { toast('O arquivo do OneDrive está danificado. Use o do outro computador.'); return false; } if (e.cancelado) return false; throw e; }
    return true;
  }
  await syncNuvem({ manual: true });
  return true;
}

const IR_NAO = /farm[aá]cia|drogaria|droga ?raia|drogasil|pague ?menos|panvel|rem[eé]dio|medicamento|[oó]culos|[oó]tica|lente|academia|vitamina|suplement|material escolar|uniforme|idioma|ingl[eê]s|espanhol|curso de|livro|transporte escolar|van escolar|notebook|computador|tablet|celular|mochila/i;

/* ---------- PREVISÃO DO CAIXA ---------- */
function previsaoCaixa(n = 3) {
  const cur = ymOf(hoje()); const hist = [1, 2, 3].map((i) => addM(cur, -i)).filter((m) => db.lancamentos.some((l) => ymOf(l.data) === m));
  const todos = (m) => db.lancamentos.filter((l) => ymOf(l.data) === m);
  const parc = (m) => soma(todos(m).filter((l) => l.tipo === 'Despesa' && Number(l.parcelas) > 1), 'valor');
  const nomesFixos = new Set(db.contasPagar.map((c) => semAcento(c.descricao).trim())); const ligados = new Set(db.contasPagar.map((c) => c.lancamento).filter(Boolean));
  const ehFixo = (l) => ligados.has(l.id) || nomesFixos.has(semAcento(l.descricao).trim());
  const variavelDo = (m) => soma(todos(m).filter((l) => l.tipo === 'Despesa' && !(Number(l.parcelas) > 1) && l.categoria !== 'Dívidas' && !ehFixo(l)), 'valor');
  const media = (f) => (hist.length ? hist.reduce((s, m) => s + f(m), 0) / hist.length : 0);
  const recMed = media((m) => soma(todos(m).filter((l) => l.tipo === 'Receita'), 'valor'));
  const varMed = media(variavelDo);
  const recorrentes = new Map(); [...db.contasPagar].sort((a, b) => (a.vencimento < b.vencimento ? -1 : 1)).forEach((c) => { if (c.recorrente) recorrentes.set(c.descricao, c); });
  const acordos = soma(db.dividas.filter((d) => d.situacao !== 'quitada' && temParcela(d)), (d) => Number(d.parcela) || 0);
  const out = [];
  for (let i = 1; i <= n; i++) {
    const m = addM(cur, i); const pend = db.contasPagar.filter((c) => ymOf(c.vencimento) === m && c.status !== 'Pago');
    let fixas = soma(pend, 'valor'); const ja = new Set(pend.map((c) => c.descricao));
    recorrentes.forEach((c, k) => { if (!ja.has(k) && c.vencimento < `${m}-01`) fixas += Number(c.valor) || 0; });
    const parcelas = soma(db.lancamentos.filter((l) => ymOf(l.data) === m && l.tipo === 'Despesa' && Number(l.parcelas) > 1), 'valor');
    const d = r2(fixas + parcelas + acordos + varMed); const r = r2(recMed);
    out.push({ m, r, fixas: r2(fixas), parcelas: r2(parcelas), dividas: r2(acordos), variavel: r2(varMed), d, s: r2(r - d) });
  }
  return { meses: out, base: hist.length, recMed: r2(recMed) };
}
function widgetPrevisao() {
  const P = previsaoCaixa(3); if (!P.base) return `<div class="card" data-wid="previsao"><h2>Previsão do caixa</h2><p class="sub">Aparece depois de um mês completo de lançamentos.</p></div>`;
  const pior = P.meses.reduce((a, b) => (b.s < a.s ? b : a));
  return `<div class="card span2" data-wid="previsao"><div class="card-h"><h2>Previsão do caixa</h2><button class="btn sm" data-prev-det>Ver detalhes</button></div><p class="sub">Próximos 3 meses, pela média dos últimos ${P.base} ${P.base === 1 ? 'mês' : 'meses'}, contas fixas, parcelas e acordos</p>
    <div class="prev">${P.meses.map((x) => `<div class="prev-m ${x.s < 0 ? 'neg' : x.s < P.recMed * 0.05 ? 'apertado' : ''}"><span class="muted">${nomeMes(x.m)}</span><b>${x.s >= 0 ? '' : '−'}${fmt0(Math.abs(x.s))}</b><small>${x.s < 0 ? 'deve faltar' : 'deve sobrar'}</small><div class="prev-bar"><i style="width:${Math.min(100, x.r ? (x.d / x.r) * 100 : 100)}%"></i></div><small class="muted">entra ${fmt0(x.r)} · sai ${fmt0(x.d)}</small></div>`).join('')}</div>

const icsData = (d) => d.replace(/-/g, ''); const icsTxt = (s) => String(s).replace(/[\\;,]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
function gerarICS({ contas = true, sessoes = true, dias = 60 } = {}) {
  const H = hoje(); const fim = addDias(H, dias); const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z'; const ev = [];
  if (contas) {
    db.contasPagar.filter((c) => c.status !== 'Pago' && c.vencimento >= H && c.vencimento <= fim).forEach((c) => ev.push(['BEGIN:VEVENT', `UID:conta-${c.id}@financas-familia`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${icsData(c.vencimento)}`, `DTEND;VALUE=DATE:${icsData(addDias(c.vencimento, 1))}`, `SUMMARY:${icsTxt(`Vence: ${c.descricao} · ${fmt(c.valor)}`)}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsTxt('Conta vence amanhã: ' + c.descricao)}`, 'TRIGGER:-PT15H', 'END:VALARM', 'END:VEVENT']));
  }
  if (sessoes && db.cons.pacientes.length) {
    ocorrencias(H, fim).filter((o) => o.pid && o.hora && !o.feito).forEach((o) => {
      const [h, mi] = o.hora.split(':').map(Number); const ini = `${icsData(o.data)}T${pad(h)}${pad(mi)}00`; const t = new Date(+o.data.slice(0, 4), +o.data.slice(5, 7) - 1, +o.data.slice(8, 10), h, mi + 50); const fimS = `${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}T${pad(t.getHours())}${pad(t.getMinutes())}00`;
      ev.push(['BEGIN:VEVENT', `UID:sessao-${o.pid}-${o.data}@financas-familia`, `DTSTAMP:${stamp}`, `DTSTART:${ini}`, `DTEND:${fimS}`, `SUMMARY:${icsTxt(`${ehSuperv(pacById(o.pid)) ? 'Supervisão' : 'Sessão'} · ${pacById(o.pid)?.codigo || ''}`)}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Sessão em 30 minutos', 'TRIGGER:-PT30M', 'END:VALARM', 'END:VEVENT']);
    });
  }
  const PL = db.invest?.plano; if (contas && PL && PL.dia) for (let i = 0; i <= Math.ceil(dias / 30); i++) { const m = addM(ymOf(H), i); const d = `${m}-${pad(PL.dia)}`; if (d >= H && d <= fim && !(i === 0 && aportesDoMes(m) > 0)) ev.push(['BEGIN:VEVENT', `UID:aporte-${m}@financas-familia`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${icsData(d)}`, `DTEND;VALUE=DATE:${icsData(addDias(d, 1))}`, `SUMMARY:${icsTxt('Dia do aporte' + (PL.valor ? ' · ' + fmt(PL.valor) : ''))}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Dia de investir', 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT']); }
  const linhas = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Financas da Familia//PT-BR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Prumo', ...ev.flat(), 'END:VCALENDAR'];
  return { texto: linhas.join('\r\n') + '\r\n', n: ev.length };
}

function gradeMes(mes) {
  const ini = segundaDe(mes + '-01'); const [y, m] = mes.split('-').map(Number); const ult = `${mes}-${pad(new Date(y, m, 0).getDate())}`; const fim = addDias(segundaDe(ult), 6);

}

function graficoLinhas(series, max, { w = 520, h = 170 } = {}) {

  const xs = [...new Set(todas)].sort(); const X = (x) => 34 + (xs.length === 1 ? (w - 50) / 2 : (xs.indexOf(x) / (xs.length - 1)) * (w - 50)); const Y = (v) => 10 + (1 - v / max) * (h - 34);

  const lin = series.map((s) => `<polyline fill="none" stroke="${s.cor}" stroke-width="2.4" stroke-linejoin="round" points="${s.pts.map((p) => `${X(p.x)},${Y(p.y)}`).join(' ')}"/>${s.pts.map((p) => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${s.cor}"><title>${s.nome} · ${dmy(p.x)}: ${p.y}</title></circle>`).join('')}`).join('');
  const rot = xs.map((x, i) => (xs.length <= 8 || i % Math.ceil(xs.length / 8) === 0 ? `<text class="tick" x="${X(x)}" y="${h - 6}" text-anchor="middle">${dmy(x).slice(0, 5)}</text>` : '')).join('');
  return `<div class="chart" style="min-height:0"><svg viewBox="0 0 ${w} ${h}" width="100%">${grade}${lin}${rot}</svg></div>`;
}

  const mx = Math.max(1, ...porMes.map((x) => x.r + x.f));
  const ult = [...at].filter((a) => a.data <= H).sort((a, b) => (a.data < b.data ? 1 : -1))[0]; const prox = proximasPorPac().get(pid);
  const evos = clinDe('evo').filter((e) => e.pid === pid); const rev = evos.filter((e) => e.status === 'rascunho').length;
  const semEvo = at.filter((a) => (a.status === 'pago' || a.status === 'pendente') && !evos.some((e) => e.data === a.data)).length;

/* =================== v4.2: PLANEJAR (calendário · envelopes · saldos e patrimônio · assinaturas · desafios · "e se" · posso comprar · colar aviso · regras · comprovantes · resumo da semana) =================== */
const ehBanco = (c) => c && c.tipo !== 'cartao';

/* ---------- regras automáticas ---------- */

}

/* ---------- saldos das contas ---------- */
function movConta(c, ate) { // movimento depois do saldo informado (sinal +) ou entre a data e o saldo (sinal -)
  const base = c.saldoData; const em = c.saldoEm || ''; const fwd = ate >= base;
  const depois = (x) => x.data > base || (x.data === base && em && (x._m || x.criado || '') > em);
  const conta = (x) => (fwd ? depois(x) && x.data <= ate : !depois(x) && x.data > ate);
  let v = 0;
  db.lancamentos.forEach((l) => { if (l.conta === c.id && conta(l)) v += l.tipo === 'Receita' ? l.valor : -l.valor; });
  (db.invest?.movs || []).forEach((m) => { if (m.conta === c.id && conta(m)) v += m.tipo === 'resgate' || m.tipo === 'provento' || m.tipo === 'venda' ? m.valor : m.tipo === 'aporte' || m.tipo === 'compra' ? -m.valor : 0; });
  const de = fwd ? base : ate, ate2 = fwd ? ate : base;

  return v;
}
function saldoConta(c, ate = hoje()) {

const saldoBancos = (ate = hoje()) => { const l = bancos().map((c) => saldoConta(c, ate)); return l.some((x) => x != null) ? r2(soma(l.filter((x) => x != null), (x) => x)) : null; };
function faturasFuturas() { const ms = Array.from({ length: 14 }, (_, i) => addM(ymOf(hoje()), i - 1)); let t = 0; faturas(ms).forEach((f) => ms.forEach((m, i) => { if (vencFat(f.conta, m) >= hoje()) t += f.valores[i]; })); return r2(t); }

/* ---------- calendário do mês ---------- */
function calendarioMes(mes) {

  db.contasPagar.filter((c) => c.status !== 'Pago').forEach((c) => { const d = c.vencimento < H && ymOf(H) === mes ? H : c.vencimento; if (ymOf(d) === mes) add(d, { t: c.descricao + (c.vencimento < H ? ' (atrasada)' : ''), v: -c.valor, tipo: 'conta' }); });
  const fs = faturas([mes]); fs.forEach((f) => { if (f.valores[0] > 0) add(vencFat(f.conta, mes), { t: 'Fatura ' + f.conta.nome, v: -f.valores[0], tipo: 'fatura' }); });
  (db.invest?.movs || []).forEach((x) => { if (ymOf(x.data) === mes && x.conta && x.tipo !== 'atualizacao') add(x.data, { t: ({ aporte: 'Aporte · ', compra: 'Compra · ', resgate: 'Resgate · ', venda: 'Venda · ' }[x.tipo] || 'Provento · ') + (db.invest.ativos.find((a) => a.id === x.ativo)?.ticker || db.invest.ativos.find((a) => a.id === x.ativo)?.nome || ''), v: x.tipo === 'aporte' || x.tipo === 'compra' ? -x.valor : x.valor, tipo: x.data > H ? 'futuro' : 'real' }); });
  if (mes >= ymOf(H)) { // receitas previstas: as do mês anterior que ainda não entraram
    const ant = db.lancamentos.filter((l) => l.tipo === 'Receita' && ymOf(l.data) === addM(mes, -1) && ehBanco(db.contas.find((k) => k.id === l.conta)));
    const ja = new Set(db.lancamentos.filter((l) => l.tipo === 'Receita' && ymOf(l.data) === mes).map((l) => chaveDesc(l.descricao)));
    ant.forEach((l) => { if (ja.has(chaveDesc(l.descricao))) return; const d = `${mes}-${pad(Math.min(nd, +l.data.slice(8)))}`; if (d > H) add(d, { t: l.descricao + ' (previsto)', v: l.valor, tipo: 'previsto' }); });
  }

  const PJ = conhecido && mes >= ymOf(H) ? projetarSaldo(fimDoMes(mes) > horizonteFuturo() ? fimDoMes(mes) : horizonteFuturo()) : null; const pm = PJ ? new Map(PJ.dias.map((x) => [x.d, x])) : null;

  const out = dias.map((d) => { if (pm && d > H && pm.has(d)) { const p = pm.get(d); const l = p.L.map((x) => ({ t: x.t, v: x.v, tipo: TIPO[x.k] || 'futuro' })); const vis = l.filter((x) => x.tipo !== 'estimado'); s = p.s; return { d, l, ent: soma(vis.filter((x) => x.v > 0), 'v'), sai: -soma(vis.filter((x) => x.v < 0), 'v'), s }; } const l = it[d]; const ent = soma(l.filter((x) => x.v > 0), 'v'), sai = -soma(l.filter((x) => x.v < 0), 'v'); if (d <= H && conhecido) s = saldoBancos(d); else s = r2(s + ent - sai); return { d, l, ent, sai, s }; });

}

const atribuido = (e, mes) => { const r = (db.envAtrib || []).find((x) => x.id === `${mes}|${e.id}`); return r ? Number(r.valor) || 0 : Number(e.padrao) || 0; };

/* ---------- assinaturas e gastos que se repetem ---------- */
function detectarAssinaturas() {
  const H = hoje(); const ms = [0, 1, 2, 3].map((i) => addM(ymOf(H), -i)); const g = new Map(); const ign = new Set(db.assinIgnora || []);
  db.lancamentos.filter((l) => l.tipo === 'Despesa' && ms.includes(ymOf(l.data)) && !(Number(l.parcelas) > 1)).forEach((l) => { const k = chaveDesc(l.descricao); if (!k) return; const x = g.get(k) || { k, nome: l.descricao, cat: l.categoria, l: [] }; x.l.push(l); g.set(k, x); });
  const out = [];
  g.forEach((x) => {
    if (ign.has(x.k)) return; const porMes = new Map(); x.l.forEach((l) => porMes.set(ymOf(l.data), (porMes.get(ymOf(l.data)) || 0) + l.valor));
    const vals = [...porMes.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1)).map((e) => e[1]); const n = vals.length;
    const med = [...vals].sort((a, b) => a - b)[Math.floor(n / 2)]; const estavel = vals.every((v) => Math.abs(v - med) <= med * 0.2);
    if (!((n >= 3 && estavel && x.l.length <= n + 1) || (x.cat === 'Assinaturas' && n >= 1))) return;
    const ult = vals[n - 1]; const ant = vals[n - 2]; out.push({ ...x, mensal: r2(ult), anual: r2(ult * 12), meses: n, subiu: ant && ult > ant * 1.05 ? r2(ult - ant) : 0, ultima: x.l.map((l) => l.data).sort().pop() });
  });
  return out.sort((a, b) => b.mensal - a.mensal);
}
function blocoAssinaturas() {
  const A = detectarAssinaturas(); const tot = soma(A, 'mensal'); const sub = A.filter((a) => a.subiu);
  return `<div class="kpis">${kpiBox('Gastos que se repetem', String(A.length))}${kpiBox('Por mês', fmt0(tot))}${kpiBox('Por ano', fmt0(tot * 12), 'o que isso vira em 12 meses')}${kpiBox('Ficaram mais caros', String(sub.length), sub.length ? 'confira se o preço subiu' : 'nenhum', sub.length ? 'warn' : '')}</div>

const BANCOS_RE = [['nubank|nu pagamentos', 'nu'], ['itau', 'ita'], ['bradesco', 'brad'], ['santander', 'sant'], ['caixa', 'caixa'], ['banco do brasil|\\bbb\\b', 'brasil'], ['inter\\b', 'inter'], ['c6', 'c6'], ['mercado pago', 'mercado'], ['picpay', 'picpay'], ['sicoob', 'sicoob'], ['sicredi', 'sicredi'], ['next', 'next'], ['pagbank|pagseguro', 'pag']];
function lerAvisos(txt) {
  const blocos = String(txt).replace(/\r/g, '').split(/\n\s*\n|(?=\b(?:Compra|Pix|Transfer[eê]ncia|Pagamento|Voc[eê] recebeu|Recebemos|D[eé]bito|Saque)\b)/i).map((s) => s.trim()).filter((s) => /R\$\s*-?[\d.]+,\d{2}/.test(s));
  const H = hoje(); const ano = H.slice(0, 4);
  return blocos.map((b, i) => {
    const sem = semAcento(b); const v = parseValor(b.match(/R\$\s*-?([\d.]+,\d{2})/)[1]);
    const dm = b.match(/\b(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\b/); let data = H; if (dm) { const yy = dm[3] ? (dm[3].length === 2 ? '20' + dm[3] : dm[3]) : ano; const d = `${yy}-${dm[2]}-${dm[1]}`; if (!isNaN(new Date(d + 'T12:00'))) data = d > H ? `${+yy - 1}-${dm[2]}-${dm[1]}` : d; }
    const rec = /receb|recebeu|recebido|credito em conta|deposito|estorno|reembolso|entrada de|transferencia recebida/.test(sem);
    let desc = (b.match(/\b(?:em|no estabelecimento|na loja)\s+([A-Za-zÀ-ú0-9*&'. -]{3,40}?)(?=\s+(?:em|no|na|com|para|foi|aprovad|dia|às|as|\d{2}\/)|[.,;\n]|$)/i) || b.match(/\bpara\s+([A-Za-zÀ-ú0-9*&'. -]{3,40}?)(?=[.,;\n]|\s+(?:no|em|foi|dia)|$)/i) || b.match(/\bde\s+([A-ZÀ-Ú][A-Za-zÀ-ú0-9*&'. -]{2,40}?)(?=[.,;\n]|\s+(?:no|em|foi|dia)|$)/) || [])[1];
    if (!desc) desc = b.replace(/R\$\s*[\d.,]+/g, '').replace(/\d{2}\/\d{2}(\/\d{2,4})?/g, '').replace(/\s+/g, ' ').slice(0, 40);
    desc = desc.replace(/\s+/g, ' ').trim(); if (/pix/i.test(sem) && !/^pix/i.test(desc)) desc = (rec ? 'Pix de ' : 'Pix para ') + desc;
    const banco = BANCOS_RE.find(([re]) => new RegExp(re).test(sem)); const cartao = /compra (no cartao|aprovada|no credito|credito)|cartao (final|de credito)/.test(sem);
    return { data, descricao: desc, valor: rec ? v : -v, fitid: 'cola:' + data + '|' + v + '|' + chaveDesc(desc), banco: banco?.[1], cartao };
  });
}

/* ---------- avisos: ritmo do orçamento e gasto fora do padrão ---------- */
function avisosRitmo() {
  const out = []; const H = hoje(); const m = ymOf(H); const dia = +H.slice(8); const nd = new Date(+m.slice(0, 4), +m.slice(5), 0).getDate(); const fr = dia / nd;
  orcamento(m).forEach((o) => { if (o.meta > 0 && o.gasto <= o.meta && o.uso >= 0.5 && o.uso > fr + 0.2) out.push(['warn', `<b>${esc(o.nome)}</b> já usou ${pct(o.uso)} do orçamento e o mês está em ${pct(fr)}. Nesse ritmo, passa do limite.`, 'painel']); });
  const semana = addDias(H, -7);
  db.lancamentos.filter((l) => l.tipo === 'Despesa' && l.data >= semana && l.valor >= 200 && !(Number(l.parcelas) > 1)).forEach((l) => {
    const hist = db.lancamentos.filter((x) => x.categoria === l.categoria && x.tipo === 'Despesa' && x.id !== l.id && x.data >= addDias(H, -120)).map((x) => x.valor).sort((a, b) => a - b);
    if (hist.length >= 4 && l.valor > hist[Math.floor(hist.length / 2)] * 3) out.push(['info', `Gasto fora do comum: <b>${esc(l.descricao)}</b> (${fmt(l.valor)}) em ${esc(l.categoria)}, bem acima do normal dessa categoria.`, 'lancamentos']);
  });
  const C = calendarioMes(m); if (C.conhecido && C.neg) out.push(['bad', `Pelo calendário, o saldo das contas deve ficar <b>negativo no dia ${dmy(C.neg.d).slice(0, 5)}</b>.`, 'planejar', 'calendario']);
  return out;
}

  garantirInvest(); const I = db.invest; const meta = Number(I.metaRenda) || 0; const RP = rendaPassiva(); const T = investTotal(); const dyV = 0.06; const realA = 0.05;
  const nec = meta * 12 / dyV; const atual = T.atual; const ap = Number(I.plano?.valor) || projecao(1).ap || 0;
  let v = atual, m = 0; if (meta) while (v < nec && m < 720) { v = v * Math.pow(1 + realA, 1 / 12) + ap; m++; }
  return { meta, nec, atual, ap, rendaHoje: RP.mes, anos: meta ? (v >= nec ? m / 12 : null) : null, dyV, realA };
}
function cardAposentadoria() {

  const pR = Math.min(1, R.rendaHoje / R.meta); const pP = Math.min(1, R.atual / R.nec); const ano = R.anos != null ? new Date().getFullYear() + Math.ceil(R.anos) : null;
