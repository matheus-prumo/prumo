function catPorPalavras(desc, tipo = 'Despesa') {
  if (tipo !== 'Despesa') return null; const s = ' ' + semAcento(desc) + ' '; const cats = db.categorias.filter((c) => c.tipo === tipo).map((c) => c.nome);
  for (const [re, cat] of PALAVRAS_CAT) if (re.test(s) && cats.includes(cat)) return cat;
  return null;
}
// histórico: a categoria do lançamento MAIS RECENTE com a mesma descrição (assim, quando você corrige, ele aprende)
function catPorHistorico(desc, tipo) {
  const k = chaveDesc(desc); if (!k) return null; let best = null;
  for (const l of db.lancamentos) if (l.tipo === tipo && chaveDesc(l.descricao) === k && (!best || (l.data + (l._m || '')) > (best.data + (best._m || '')))) best = l;
  return best && db.categorias.some((c) => c.nome === best.categoria && c.tipo === tipo) ? best.categoria : null;
}
// usada no formulário e no Fechar o dia: só devolve algo quando tem certeza
function categoriaAuto(desc, tipo = 'Despesa') {
  if (String(desc || '').trim().length < 3) return null;
  const rg = regraPara(desc, tipo); if (rg) return rg.categoria;
  return catPorHistorico(desc, tipo) || catPorPalavras(desc, tipo);
}
sugerirCategoria = ((orig) => function (desc, tipo) { return categoriaAuto(desc, tipo) || orig(desc, tipo); })(sugerirCategoria);

// lista para o "auto completar" da descrição
function descricoesFrequentes(tipo = 'Despesa', lim = 200) {
  const m = new Map(); const desde = addMDate(hoje(), -18);
  db.lancamentos.filter((l) => l.tipo === tipo && l.data >= desde && l.descricao && !l.origemDivida).forEach((l) => { const k = semAcento(l.descricao.trim()); const x = m.get(k) || { d: l.descricao.trim(), n: 0, cat: l.categoria, data: '' }; x.n++; if (l.data >= x.data) { x.data = l.data; x.cat = l.categoria; x.d = l.descricao.trim(); } m.set(k, x); });
  return [...m.values()].sort((a, b) => b.n - a.n).slice(0, lim);
}
const datalistDesc = (id, tipo = 'Despesa') => `<datalist id="${id}">${descricoesFrequentes(tipo).map((x) => `<option value="${esc(x.d)}" label="${esc(x.cat)} · ${x.n === 1 ? '1 vez' : x.n + ' vezes'}"></option>`).join('')}</datalist>`;

/* ---------- migração para as categorias novas ---------- */
function trocarCategoria(d, de, para) {
  const t = (o, k) => { if (o && o[k] === de) o[k] = para; };
  (d.categorias || []).forEach((c) => t(c, 'nome'));
  ['lancamentos', 'contasPagar', 'regras'].forEach((k) => (d[k] || []).forEach((x) => t(x, 'categoria')));
  ['envelopes', 'desafios'].forEach((k) => (d[k] || []).forEach((x) => { if (Array.isArray(x.cats)) x.cats = x.cats.map((c) => (c === de ? para : c)); t(x, 'cat'); t(x, 'categoria'); }));
}
function migrarCategorias(d) {
  if ((d.catVer || 0) >= 2) return d;
  const tem = (n) => d.categorias.some((c) => c.nome === n && c.tipo === 'Despesa');
  if (tem('Restaurantes') && !tem(CAT_COMER)) trocarCategoria(d, 'Restaurantes', CAT_COMER);
  for (const [nome, depois] of CATS_NOVAS) if (!tem(nome)) { const i = d.categorias.findIndex((c) => c.nome === depois && c.tipo === 'Despesa'); const nova = { nome, tipo: 'Despesa', meta: 0 }; if (i >= 0) d.categorias.splice(i + 1, 0, nova); else { const o = d.categorias.findIndex((c) => c.nome === 'Outros' && c.tipo === 'Despesa'); d.categorias.splice(o >= 0 ? o : d.categorias.length, 0, nova); } }
  d.catVer = 2; return d;
}
const CAT_GENERICAS = ['Moradia', 'Outros', 'Mercado', 'Compras', 'Lazer', 'Saúde', 'Transporte'];
function candidatosReorganizar() {
  const novas = CATS_NOVAS.map((x) => x[0]); const out = [];
  db.lancamentos.forEach((l) => { if (l.tipo !== 'Despesa' || l.origemDivida || l.importId === 'acordo') return; const c = catPorPalavras(l.descricao); if (c && novas.includes(c) && l.categoria !== c && CAT_GENERICAS.includes(l.categoria)) out.push({ k: 'l', o: l, de: l.categoria, para: c }); });
  db.contasPagar.forEach((x) => { const c = catPorPalavras(x.descricao); if (c && novas.includes(c) && x.categoria !== c && CAT_GENERICAS.includes(x.categoria)) out.push({ k: 'c', o: x, de: x.categoria, para: c }); });
  return out;
}

const LIGACOES = { '': 'Sem ligação (pelas tarefas)', recomeco: 'Recomeço: quitar uma dívida', loja: 'Loja: aumentar as vendas', treino: 'Treinos por semana', cons: 'Consultório: pacientes ativos' };
function vendasSemana(ate) { const ini = addDias(ate, -27); return soma((db.loja?.vendas || []).filter((v) => v.data > ini && v.data <= ate), (v) => vendaBruta(v)) / 4; }
function treinosEntre(p, a, b) { return riDe(p, 'tconc').filter((x) => x.data >= a && x.data <= b).length + riDe(p, 'corrida').filter((x) => x.data >= a && x.data <= b).length; }
function progressoMeta(m) {

    if (m.link === 'loja') { const base = Number(m.base) || 0; const at = vendasSemana(hoje()); const alvo = (Number(m.alvo) || 20) / 100; if (base > 0) { const g = at / base - 1; return { p: Math.max(0, Math.min(1, g / alvo)), txt: `${g >= 0 ? '+' : ''}${pct(g)} nas vendas (média de 4 semanas) · meta +${m.alvo || 20}%` }; } }
    if (m.link === 'treino') { const c = cfgR(m.p); const alvo = (Number(m.alvo) || 3) * 13; const n = treinosEntre(m.p, c.ciclo, fimCiclo(m.p)); return { p: Math.min(1, n / alvo), txt: `${n} de ${alvo} treinos no ciclo` }; }
    if (m.link === 'cons') { const n = db.cons.pacientes.filter((x) => x.ativo !== false).length; const alvo = Number(m.alvo) || 15; return { p: Math.min(1, n / alvo), txt: `${n} de ${alvo} pacientes ativos` }; }

}

/* ---------- foco (cronômetro) ---------- */
const focoKey = (p) => 'ff-foco-' + p;
const focoAtual = (p) => { try { return JSON.parse(lsGet(focoKey(p)) || 'null'); } catch (e) { return null; } };
function focoRestante(f) { if (!f) return 0; const pas = f.pausa ? f.pausadoEm - f.ini - (f.pausas || 0) : Date.now() - f.ini - (f.pausas || 0); return Math.max(0, f.min * 60000 - pas); }
const mmss = (ms) => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

/* ---------- hábitos ---------- */
const habDia = (p, d = hoje()) => riGet(`hab-${p}-${d}`)?.marcados || [];
function autoHab(p, d) { const m = new Set(habDia(p, d)); if (treinosEntre(p, d, d)) m.add('treino'); if (p === 'mat' && typeof diasLimpo === 'function' && diasLimpo() != null && d <= hoje() && db.recomeco?.inicioLimpo && db.recomeco.inicioLimpo <= d) m.add('apostar'); return m; }
function toggleHab(p, k, d = hoje()) { const id = `hab-${p}-${d}`; const L = new Set(habDia(p, d)); if (L.has(k)) L.delete(k); else L.add(k); riSet({ id, p, tipo: 'hab', data: d, marcados: [...L] }); }
function sequencia(p, k) { let n = 0; let d = hoje(); if (!autoHab(p, d).has(k)) d = addDias(d, -1); while (autoHab(p, d).has(k) && n < 400) { n++; d = addDias(d, -1); } return n; }
function pctHabSemana(p, seg = segunda()) { const H = cfgR(p).habitos; if (!H.length) return 0; let t = 0, f = 0; const desde = cfgR(p).criado || '0000'; for (let i = 0; i < 7; i++) { const d = addDias(seg, i); if (d > hoje()) break; if (d < desde) continue; const m = autoHab(p, d); H.forEach((h) => { t++; if (m.has(h.k)) f++; }); } return t ? f / t : 0; }
function cardHabitos(p) {
  const H = cfgR(p).habitos; const m = autoHab(p, hoje()); const best = H.map((h) => ({ h, s: sequencia(p, h.k) })).sort((a, b) => b.s - a.s)[0];
  return `<div class="card"><h3>⚡ ${p === 'hel' ? 'Autocuidado' : 'Energia'} de hoje</h3><div class="rt-hab">${H.map((h) => `<button class="${m.has(h.k) ? 'on' : ''}" data-rh="${p}|${h.k}"><span>${h.ic}</span>${esc(h.t)}</button>`).join('')}</div>
    <p class="small muted" style="margin:10px 0 0">${best && best.s > 1 ? `Sequência: ${best.h.ic} ${esc(best.h.t)} há ${best.s} dias 🔥 · ` : ''}Semana: ${pct(pctHabSemana(p))} dos hábitos</p></div>`;
}

function numerosPessoa(p, seg = segunda()) {
